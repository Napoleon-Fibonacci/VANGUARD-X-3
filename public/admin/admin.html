<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin - X-3 Vanguard</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel-decorative@5.0.5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel-decorative@5.0.5/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel@5.0.5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel@5.0.5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel@5.0.5/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.0.5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.0.5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.0.5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.0.5/400-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/medievalsharp@5.0.5/400.css">
<link rel="stylesheet" href="/styles.css">
<style>
  body { padding: 2rem; max-width: 900px; margin: 0 auto; opacity: 1; background-color: var(--bg-dark-base); }

  .admin-box { background: var(--bg-stone-card); border: 1px solid var(--iron-border); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; }
  .admin-box h3 { font-family: var(--font-heading); color: var(--gold-bright); font-size: 1.1rem; margin-bottom: 1rem; }

  .admin-row { display: flex; flex-direction: column; align-items: stretch; gap: .35rem; margin-bottom: 1.1rem; }
  .admin-row label { font-family: var(--font-heading); font-weight: 700; color: var(--text-primary); font-size: .95rem; }
  .admin-row input[type="text"],
  .admin-row input:not([type]),
  .admin-row textarea {
    background: var(--bg-stone-dark); color: var(--text-primary);
    border: 1px solid var(--iron-border); border-radius: 4px;
    padding: .6rem .7rem; font-family: var(--font-body); font-size: 1rem;
  }
  .admin-row input:focus, .admin-row textarea:focus {
    outline: none; border-color: var(--gold-primary); box-shadow: 0 0 8px var(--gold-glow);
  }
  .admin-row small { color: var(--text-muted); font-size: .82rem; }
  .admin-row textarea { min-height: 70px; resize: vertical; }

  /* File upload field */
  .upload-field {
    background: var(--bg-stone-dark); border: 1px dashed var(--iron-border);
    border-radius: 6px; padding: 1rem; display: flex; gap: 1rem; align-items: center;
  }
  .upload-field input[type="file"] { color: var(--text-muted); font-size: .85rem; }
  .upload-preview {
    width: 64px; height: 64px; border-radius: 6px; object-fit: cover;
    border: 2px solid var(--iron-border); display: none; flex-shrink: 0;
  }
  .upload-status { font-size: .82rem; color: var(--text-muted); }
  .upload-status.uploading { color: var(--gold-primary); }
  .upload-status.done { color: var(--gold-bright); }
  .upload-status.error { color: var(--crimson-bright); }

  .form-heading { font-family: var(--font-title); color: var(--gold-bright); font-size: 1.3rem; margin-bottom: 1.2rem; }

  .tab-bar { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  .tab-bar button { padding: .6rem 1.2rem; cursor: pointer; }

  #loginBox {
    max-width: 380px; margin: 6rem auto; text-align: center;
    padding: 3rem 2.5rem 2.5rem; position: relative; overflow: visible;
    background: linear-gradient(180deg, var(--bg-stone-card) 0%, var(--bg-dark-base) 100%);
    border: 1px solid var(--iron-border);
    box-shadow: var(--shadow-castle);
  }
  .login-seal {
    width: 68px; height: 68px; margin: -3rem auto 1.2rem;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
  }
  #loginBox h2 {
    font-family: var(--font-title); font-size: 1.7rem; margin-bottom: .3rem;
  }
  .login-sub {
    font-family: var(--font-medieval); color: var(--text-muted); font-size: .85rem;
    letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 1.8rem;
  }
  #loginBox input {
    width: 100%; padding: .8rem 1rem; font-family: var(--font-body); font-size: 1rem;
    border-radius: 4px; border: 1px solid var(--iron-border);
    background: var(--bg-stone-dark); color: var(--text-primary);
  }
  #loginBox input::placeholder { color: var(--text-muted); }
  #loginBox input:focus { outline: none; border-color: var(--gold-primary); box-shadow: 0 0 10px var(--gold-glow); }
  #loginBox .btn-medieval { width: 100%; justify-content: center; margin-top: 1.4rem; }
  #loginErr { margin-top: 1rem; min-height: 1.2em; font-family: var(--font-medieval); font-size: .9rem; }

  #dashboard h1 { font-family: var(--font-title); font-size: 2rem; margin-bottom: 1.5rem; }

  ul#list { list-style: none; }
  ul#list li { border-bottom: 1px solid var(--iron-border); padding: .6rem 0; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  ul#list li span:first-child { font-family: var(--font-body); }
  ul#list li small { color: var(--text-muted); }
  ul#list button { margin-left: .4rem; padding: .35rem .8rem; cursor: pointer; }

  #saveBtn, #cancelBtn { margin-top: .5rem; }
  #cancelBtn { background: transparent; color: var(--text-muted); border: 1px solid var(--iron-border); padding: .6rem 1.4rem; border-radius: 4px; cursor: pointer; margin-left: .6rem; }
</style>
</head>
<body>

<div id="loginBox" class="admin-box">
  <svg class="login-seal" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" fill="#7a1c1c" stroke="#d4af37" stroke-width="3"/>
    <path d="M50 20c1.5 3 4 5 4 8a4 4 0 0 1-8 0c0-3 2.5-5 4-8z M40 35c2.5 0 5-1 6-4-1 4-4 6-6 6z M60 35c-2.5 0-5-1-6-4 1 4 4 6 6 6z M44 39h12v2H44z M50 39v6" fill="#f7d070" stroke="#f7d070"/>
  </svg>
  <h2>Gerbang Admin</h2>
  <div class="login-sub">X-3 Vanguard</div>
  <input type="password" id="pw" placeholder="Kata sandi">
  <button class="btn-medieval gold-foil-btn" id="loginBtn">Masuk</button>
  <p id="loginErr" style="color:var(--crimson-bright);"></p>
</div>

<div id="dashboard" style="display:none;">
  <h1>Dashboard Vanguard</h1>
  <div class="tab-bar">
    <button class="filter-btn active" data-table="leadership">Petinggi</button>
    <button class="filter-btn" data-table="knights">Ksatria</button>
    <button class="filter-btn" data-table="gallery">Galeri</button>
  </div>

  <div class="admin-box">
    <form id="itemForm"></form>
    <button class="btn-medieval gold-foil-btn" id="saveBtn">Simpan</button>
    <button id="cancelBtn" style="display:none;">Batal Edit</button>
  </div>

  <div class="admin-box">
    <h3>Daftar</h3>
    <ul id="list"></ul>
  </div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
